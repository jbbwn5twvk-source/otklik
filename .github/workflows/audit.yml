name: Аудит сайтов

# Запуск вручную: Actions → «Аудит сайтов» → Run workflow.
# В поле вставьте компании через «;», например:
#   Салон Лаванда | lavanda.ru; Кофейня у дома | нет; https://example.ru
# Если поле пустое, берётся список из scraper/sites.txt.
on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Компании через «;» (Название | сайт, или «нет», если сайта нет)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Проверить сайты
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITES: ${{ inputs.sites }}
        run: python scraper/audit.py
      - name: Сохранить отчёт
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit_report.html
          if-no-files-found: ignore
