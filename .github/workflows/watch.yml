name: Сторож (срочные заказы)

on:
  schedule:
    - cron: "17 * * * *"   # раз в час проверка: если сторож не работает — запустится
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: scraper/.watch_seen.json
          key: watch-seen-${{ github.run_id }}
          restore-keys: watch-seen-
      - name: Следить за Kwork
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper/watch.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: scraper/.watch_seen.json
          key: watch-seen-${{ github.run_id }}
